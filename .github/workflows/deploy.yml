name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity checks
        run: |
          test -f index.html
          for d in css js components assets; do test -d "$d"; done
          if grep -rq "builtbygama@gmail.com" components; then
            echo "::warning::Placeholder email is still in components/contact.html"
          fi
          if grep -rq 'href="#"' components; then
            echo "::warning::A placeholder link (href=\"#\") is still present"
          fi
          test -f assets/resume.pdf || echo "::warning::assets/resume.pdf is missing, so the Download CV button will show a notice"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
